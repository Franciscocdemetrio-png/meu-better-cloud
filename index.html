<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meu Melhor Nuvem</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #xcloud-frame { width: 100%; height: 100%; border: none; }
        .controls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .btn { position: absolute; width: 70px; height: 70px; border-radius: 50%; color: white; font-weight: bold; font-size: 22px; display: flex; align-items: center; justify-content: center; user-select: none; pointer-events: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.4); }
        #btn-A { bottom: 40px; right: 40px; background: rgba(46, 204, 113, 0.6); }
        #btn-B { bottom: 120px; right: 120px; background: rgba(231, 76, 60, 0.6); }
        #btn-X { bottom: 120px; right: 40px; background: rgba(52, 152, 219, 0.6); }
        #btn-Y { bottom: 200px; right: 40px; background: rgba(241, 196, 15, 0.6); }
    </style>
</head>
<body>
    <iframe id="xcloud-frame" src="https://xbox.com"></iframe>
    <div class="controls">
        <div id="btn-A" class="btn">A</div>
        <div id="btn-B" class="btn">B</div>
        <div id="btn-X" class="btn">X</div>
        <div id="btn-Y" class="btn">Y</div>
    </div>
    <script>
        const gamepad = { id: "Xbox 360 Controller (XInput Standard Gamepad)", index: 0, connected: true, mapping: "standard", buttons: Array.from({ length: 17 }, () => ({ pressed: false, value: 0 })), axes: [0.0, 0.0, 0.0, 0.0] };
        navigator.getGamepads = () => [gamepad, null, null, null];
        function setBtn(id, press) {
            gamepad.buttons[id].pressed = press;
            gamepad.buttons[id].value = press ? 1.0 : 0.0;
            window.dispatchEvent(Object.assign(new Event("gamepadconnected"), { gamepad }));
        }
        const mapping = { 'btn-A': 0, 'btn-B': 1, 'btn-X': 2, 'btn-Y': 3 };
        document.querySelectorAll('.btn').forEach(b => {
            b.addEventListener('touchstart', (e) => { e.preventDefault(); setBtn(mapping[b.id], true); });
            b.addEventListener('touchend', (e) => { e.preventDefault(); setBtn(mapping[b.id], false); });
        });
    </script>
</body>
</html>
